name: pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'dist/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Stage docs + dist together
        run: |
          mkdir -p _site
          cp -R docs/. _site/
          mkdir -p _site/dist
          cp -R dist/. _site/dist/

      - uses: actions/configure-pages@v6
        with:
          enablement: true
          token: ${{ secrets.PAGES_TOKEN || github.token }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
